<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Building Agents</title>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      (function () {
        try {
          const t = localStorage.getItem("buildingAgents:theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
          const fs = parseFloat(localStorage.getItem("buildingAgents:fontScale") || "1");
          if (!Number.isNaN(fs) && fs > 0) {
            document.documentElement.style.setProperty("--font-scale", String(fs));
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
